name: Fix WWII medicine links

# Repoints the WWII series medical links at the ReportMedic reference page.
#
# 53 links across 24 posts were written as ](/reportmedic/some-slug), a relative
# path to a section of this site that was never built. Each maps to an anchored
# section of tools/wwii-battlefield-medicine.html on reportmedic.org.
#
# Trigger it from the browser, no terminal needed:
#   GitHub repo -> Actions tab -> Fix WWII medicine links -> Run workflow
#
# Leave "dry run" true the first time. Nothing is committed and the log lists
# every post and count. Run again with dry run false to apply.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, commit nothing'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repoint WWII medicine links
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python _scripts/fix_wwii_medicine_links.py --dry-run
          else
            python _scripts/fix_wwii_medicine_links.py
          fi

      - name: Summarise remaining references
        if: ${{ inputs.dry_run == false }}
        run: |
          left=$(grep -rho "](/reportmedic/[^)]*)" _posts 2>/dev/null | wc -l | tr -d ' ')
          new=$(grep -rho "wwii-battlefield-medicine.html#[a-z-]*" _posts 2>/dev/null | wc -l | tr -d ' ')
          echo "### WWII medicine link check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Reference | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Old /reportmedic/ links remaining | $left |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New anchored reference links | $new |" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "Repoint WWII series medical links at the ReportMedic reference page"
          git push
