# InsightCrunch BTC paywall config
# Update btc_address to your actual on-chain address before going live.

btc_address: "bc1q6xw6ah9cdvtkagf7mtga2ayjr5p69ppqvskxey"

# Each reader gets a random required amount in this range so two readers
# never see the same number. Sharing one reader's txid fails for everyone
# else because the amount on the blockchain won't match.
amount_min_sats: 4000
amount_max_sats: 8000

# How long after the reader generated their amount we accept a matching
# payment. After this, they have to start over.
unlock_window_minutes: 90

# Public block explorer used for txid validation. No API key needed.
mempool_api: "https://mempool.space/api"

# Friendly copy shown on the paywall card.
title: "Read the rest with bitcoin"
subtitle: "Join the thousands who paid once and unlocked more articles on this topic."
