<aside class="sidebar">
  <div class="sb-inner">

    <style>
      /* ── count-free sidebar additions (theme-matched) ── */
      .sb-signal{font-family:'Lora',serif;font-style:italic;font-size:11.5px;
        color:var(--amber-lt);opacity:.85;margin-top:2px}

      .sb-random{display:flex;align-items:center;gap:7px;width:100%;
        background:rgba(255,255,255,.04);border:1px solid rgba(176,96,16,.18);
        cursor:pointer;text-align:left;border-radius:6px;
        color:rgba(255,255,255,.55);font-family:'Inter',sans-serif;font-size:11.5px;
        letter-spacing:.3px;padding:9px 11px;margin-bottom:14px;
        transition:color .15s,border-color .15s,background .15s}
      .sb-random:hover{color:var(--amber-lt);border-color:rgba(176,96,16,.4);
        background:rgba(176,96,16,.08)}
      .sb-random svg{width:14px;height:14px;stroke:currentColor;fill:none;
        stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

      .sb-pick{background:rgba(176,96,16,.08);border:1px solid rgba(176,96,16,.2);
        border-radius:7px;padding:13px;margin-bottom:14px}
      .pick-body{transition:opacity .45s ease}
      .pick-body.fade{opacity:0}
      .pick-title{font-family:'Lora',serif;font-size:14px;line-height:1.3;
        color:rgba(255,255,255,.9);text-decoration:none;display:block;font-weight:500}
      .pick-title:hover{color:var(--amber-lt)}
      .pick-from{font-size:10px;color:var(--amber-lt);margin-top:7px;
        letter-spacing:.4px;text-transform:uppercase}

      /* On this day (live) */
      .sb-otd{background:rgba(255,255,255,.03);border:1px solid rgba(176,96,16,.18);
        border-radius:7px;padding:13px;margin-bottom:14px}
      .otd-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
      .otd-pulse{width:8px;height:8px;border-radius:50%;background:var(--amber-lt);
        position:relative;flex:none}
      .otd-pulse::after{content:'';position:absolute;inset:0;border-radius:50%;
        background:var(--amber-lt);animation:otdPulse 2.4s ease-out infinite}
      @keyframes otdPulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
      .otd-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;
        color:rgba(255,255,255,.4);font-weight:600}
      .otd-date{margin-left:auto;font-family:'Lora',serif;font-style:italic;
        font-size:11px;color:var(--amber-lt)}
      .otd-body{transition:opacity .45s ease;min-height:44px}
      .otd-body.fade{opacity:0}
      .otd-year{font-family:'Lora',serif;font-size:17px;font-weight:500;
        color:var(--amber-lt);line-height:1}
      .otd-text{font-size:12px;color:rgba(255,255,255,.78);line-height:1.5;margin-top:5px}
      .otd-tag{display:inline-block;margin-top:8px;font-size:8.5px;letter-spacing:1px;
        text-transform:uppercase;color:rgba(255,255,255,.35);
        border:1px solid rgba(176,96,16,.2);border-radius:100px;padding:2px 8px}

      .sb-foot{display:flex;gap:16px;padding-top:14px;
        border-top:1px solid rgba(176,96,16,.15)}
      .sb-foot a{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
        color:rgba(255,255,255,.28);text-decoration:none;transition:color .15s}
      .sb-foot a:hover{color:var(--amber-lt)}

      @media (prefers-reduced-motion:reduce){
        .pick-body,.otd-body{transition:none}
        .otd-pulse::after{animation:none}
      }

      /* Match existing mobile behaviour: sidebar becomes logo + search only */
      @media (max-width:760px){
        .sb-random,.sb-pick,.sb-otd,.sb-foot{display:none;}
      }
    </style>

    <div class="logo">
      <a href="{{ '/' | relative_url }}" class="logo-link"><div class="logo-name">Insight <em>Crunch</em></div></a>
      <div class="logo-rule"></div>
      <span class="logo-tag">technology · society · life</span>
    </div>

    <div class="sb-search">
      <div class="search-wrap">
        <input type="text" placeholder="Search the archive" id="searchInput" autocomplete="off" oninput="filterPosts(this.value)">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
    </div>

    <div class="sb-card">
      <div class="sb-name">Insight Crunch</div>
      <div class="sb-bio">Independent writing on technology, society, and the texture of everyday life.</div>
      <div class="sb-signal">A deep archive, still growing.</div>
    </div>

    <button type="button" class="sb-random" id="sbRandom">
      <svg viewBox="0 0 24 24"><path d="M4 4h4l12 16h4"/><path d="M20 4h-4L4 20"/><path d="M17 3l3 1-1 3M17 21l3-1-1-3"/></svg>
      Random read
    </button>

    <div class="sb-pick">
      <div class="sb-lbl">Editor's pick</div>
      <div class="pick-body" id="sbPickBody">
        <a href="#" class="pick-title" id="sbPickTitle">What a century-old exam still asks of us</a>
        <div class="pick-from" id="sbPickFrom">The UPSC Companion</div>
      </div>
    </div>

    <div class="sb-otd" id="sbOtd">
      <div class="otd-head">
        <span class="otd-pulse"></span>
        <span class="otd-lbl">On this day</span>
        <span class="otd-date" id="otdDate"></span>
      </div>
      <div class="otd-body" id="otdBody">
        <div class="otd-year" id="otdYear"></div>
        <div class="otd-text" id="otdText">Loading history...</div>
        <span class="otd-tag" id="otdTag" style="display:none"></span>
      </div>
    </div>

    <div class="sb-foot">
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
    </div>

  </div>

  <script>
  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ── Editor's pick: rotates so the sidebar always feels fresh. ── */
    var picks = [
      {t:"What a century-old exam still asks of us", f:"The UPSC Companion", u:"/?q=UPSC"},
      {t:"The gaokao essay that reshapes a life in three hours", f:"Gaokao Notebook", u:"/?q=Gaokao"},
      {t:"Why Feluda never carries a gun", f:"The Feluda Files", u:"/?q=Feluda"},
      {t:"Lady Macbeth and the arithmetic of ambition", f:"Reading Shakespeare", u:"/?q=Shakespeare"},
      {t:"The freedom fighter the textbooks left out", f:"Forgotten Freedom Fighters", u:"/?q=Freedom%20Fighter"}
    ];
    var pi = 0;
    var pBody = document.getElementById('sbPickBody');
    var pTitle = document.getElementById('sbPickTitle');
    var pFrom = document.getElementById('sbPickFrom');
    function renderPick(){
      if(!pTitle) return;
      pTitle.textContent = picks[pi].t;
      pTitle.setAttribute('href', picks[pi].u);
      pFrom.textContent = picks[pi].f;
    }
    renderPick();
    if(pBody && !reduce){
      setInterval(function(){
        pi = (pi + 1) % picks.length;
        pBody.classList.add('fade');
        setTimeout(function(){ renderPick(); pBody.classList.remove('fade'); }, 450);
      }, 5000);
    }

    /* ── Random read: jump to a random post anywhere on the site. ── */
    var idx = null, loading = false;
    var rbtn = document.getElementById('sbRandom');
    function jump(){
      if(!idx || !idx.length) return;
      var p = idx[Math.floor(Math.random() * idx.length)];
      if(p && p.u) window.location.href = p.u;
    }
    if(rbtn){
      rbtn.addEventListener('click', function(){
        if(idx){ jump(); return; }
        if(loading) return;
        loading = true; rbtn.style.opacity = '.6';
        fetch('/search-index.json')
          .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
          .then(function(data){ idx = data; loading = false; rbtn.style.opacity=''; jump(); })
          .catch(function(){ loading = false; rbtn.style.opacity=''; });
      });
    }

    /* ── On this day: loads history.json, rotates today's entries ── */
    var MONTHS = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
    var LABEL = {IN:'India', US:'USA', WORLD:'World', LIT:'Literature'};
    var now = new Date();
    var mm = ('0' + (now.getMonth() + 1)).slice(-2);
    var dd = ('0' + now.getDate()).slice(-2);
    var dateEl = document.getElementById('otdDate');
    if(dateEl) dateEl.textContent = now.getDate() + ' ' + MONTHS[now.getMonth()];

    var oBody = document.getElementById('otdBody');
    var oYear = document.getElementById('otdYear');
    var oText = document.getElementById('otdText');
    var oTag  = document.getElementById('otdTag');
    var events = [], oi = 0;

    function renderOtd(){
      if(!events.length) return;
      var e = events[oi];
      oYear.textContent = e.year;
      oText.textContent = e.text;
      if(e.country && LABEL[e.country]){
        oTag.textContent = LABEL[e.country];
        oTag.style.display = '';
      } else { oTag.style.display = 'none'; }
    }
    function hideOtd(){
      var card = document.getElementById('sbOtd');
      if(card) card.style.display = 'none';
    }

    fetch('/history.json')
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(data){
        events = (data[mm + '-' + dd]) || [];
        if(!events.length){ hideOtd(); return; }
        oi = Math.floor(Math.random() * events.length);   // random start
        renderOtd();
        if(events.length > 1 && !reduce){
          setInterval(function(){
            oi = (oi + 1) % events.length;
            oBody.classList.add('fade');
            setTimeout(function(){ renderOtd(); oBody.classList.remove('fade'); }, 450);
          }, 6000);
        }
      })
      .catch(function(){ hideOtd(); });
  })();
  </script>
</aside>
